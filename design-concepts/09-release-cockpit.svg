      <text x="1084" y="314" fill="#7dd3fc" font-size="18" font-weight="800" font-family="'SF Mono', Menlo, Consolas, monospace">v1.4.0</text><text x="1084" y="345" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">- New login recovery flow</text><text x="1084" y="376" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">- Offline cache stability</text><text x="1084" y="407" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">- Crash fix on rotation</text><text x="1084" y="438" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">- Updated dependency catalog</text><text x="1084" y="469" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace"></text><text x="1084" y="500" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">Risk: signing key not loaded</text><text x="1084" y="531" fill="#fed7aa" font-size="18" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">Next: run release checklist</text>
